name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # ADR 0017: the apply-layer tests boot a VM per test with cloud-hypervisor.
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: .vm
          key: vm-${{ hashFiles('tests/apply/fetch-vm.sh') }}
      - run: tests/apply/fetch-vm.sh .vm
      - run: cargo test --test apply
        env:
          DISKFORM_APPLY_VM: ${{ github.workspace }}/.vm
