[package]
name = "diskform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Declarative block storage provisioner: partitions, RAID, LUKS, LVM and btrfs from a single spec"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
serde_path_to_error = "0.1"
